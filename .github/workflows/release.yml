name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Unit tests and signed release build
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_VERSION_NAME: ${{ github.ref_name }}
          RELEASE_RUN_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease

      - name: Verify signature and rename APK
        run: |
          apk="hackerskeyboard-deadkeys-${GITHUB_REF_NAME}.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          echo "APK=$apk" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.APK }}
          generate_release_notes: true

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
